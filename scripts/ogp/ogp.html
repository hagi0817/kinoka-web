<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- OGP image template (1200x630). Rendered by scripts/build-ogp.mjs; photo.png is the graded P01 written next to this file. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500&family=Shippori+Mincho:wght@500&family=Noto+Sans+JP:wght@400&display=block">
<style>
  html, body { margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #2b2926; }
  .og__photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 55%; }
  /* Light overall tint + a soft dark ellipse behind the text; the wood siding and window light stay visible around it */
  .og::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 400px 210px at 50% 50%, rgba(43, 41, 38, 0.52) 0%, rgba(43, 41, 38, 0.3) 60%, rgba(43, 41, 38, 0) 100%),
      rgba(43, 41, 38, 0.24);
  }
  /* Centered group: inside the center 630x630 square with wide margins */
  .og__text {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    color: #f6f4ef;
    text-align: center;
    text-shadow: 0 0 24px rgba(43, 41, 38, 0.55);
  }
  .logo { display: flex; align-items: center; gap: 24px; }
  .logo__en { font-family: Jost, sans-serif; font-weight: 500; font-size: 56px; line-height: 1; letter-spacing: 0.28em; margin-right: -0.28em; }
  .logo__divider { width: 2px; height: 42px; background: #f6f4ef; opacity: 0.6; }
  .logo__ja { font-family: 'Shippori Mincho', serif; font-weight: 500; font-size: 32px; line-height: 1; letter-spacing: 0.16em; }
  .rule { width: 40px; height: 1px; background: #b39a7e; }
  .note { margin: 0; font-family: 'Noto Sans JP', sans-serif; font-size: 22px; line-height: 1.75; letter-spacing: 0.08em; opacity: 0.9; }
</style>
</head>
<body>
  <div class="og">
    <img class="og__photo" src="photo.png" alt="">
    <div class="og__text">
      <div class="logo"><span class="logo__en">KINOKA</span><span class="logo__divider"></span><span class="logo__ja">木乃家</span></div>
      <span class="rule"></span>
      <p class="note">架空の工務店を題材にした<br>Webサイト制作のポートフォリオ作品</p>
    </div>
  </div>
</body>
</html>
