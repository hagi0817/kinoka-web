<article class="news-entry">
  <div class="news-entry__meta"><time class="news-entry__date" datetime="{{datetime}}">{{date}}</time><span class="tag">{{category}}</span></div>
  <h3 class="news-entry__title"><a class="news-entry__link" href="{{href}}">{{title}}</a></h3>
  <p class="news-entry__excerpt">{{excerpt}}</p>
  {{thumb}}
  <!-- @include icons/arrow.svg -->
</article>
